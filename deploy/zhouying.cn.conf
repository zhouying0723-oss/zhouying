server {
    listen 80;
    listen [::]:80;
    server_name zhouying.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/zhouying.cn;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zhouying.cn;

    ssl_certificate /etc/letsencrypt/live/zhouying.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhouying.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/zhouying.cn;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
